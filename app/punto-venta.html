<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cobrar · GymControl</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin-styles.css">
<link rel="icon" type="image/png" href="img/circulo.png">
</head>
<body>
<div class="app">
  <nav class="menu no-imprimir" id="menu" aria-label="Menú principal"></nav>
  <main class="contenido">
    <div class="encabezado no-imprimir"><h1>Cobrar</h1></div>
    <div class="venta no-imprimir" id="venta">
      <section class="card">
        <h2>1. Socio</h2>
        <div id="socio-elegido" class="oculto"></div>
        <div id="buscador">
          <label for="q">Busca por nombre, correo o credencial</label>
          <input id="q" type="search" autocomplete="off">
          <div class="resultado-socio oculto" id="resultados"></div>
        </div>
      </section>
      <section class="card">
        <h2>2. Qué se cobra</h2>
        <div class="opciones" id="tipos" role="group" aria-label="Tipo de membresía"></div>
        <h3 style="margin:18px 0 8px">Método de pago</h3>
        <div class="opciones" id="metodos" role="group" aria-label="Método de pago" style="grid-template-columns:repeat(3,1fr)"></div>
        <div class="error" id="error" role="alert" style="margin-top:12px"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
          <span class="cifra" id="total">$0.00</span>
          <button class="btn primario" id="cobrar" disabled>Registrar cobro</button>
        </div>
      </section>
    </div>

    <section class="card recibo oculto" id="recibo">
      <h2>Recibo <span id="r-folio"></span></h2>
      <dl>
        <dt>Fecha</dt><dd id="r-fecha"></dd>
        <dt>Socio</dt><dd id="r-socio"></dd>
        <dt>Concepto</dt><dd id="r-concepto"></dd>
        <dt>Vigencia</dt><dd id="r-vigencia"></dd>
        <dt>Método</dt><dd id="r-metodo"></dd>
        <dt>Atendió</dt><dd id="r-cajero"></dd>
      </dl>
      <div class="total" id="r-total"></div>
      <div class="pie no-imprimir">
        <button class="btn" id="nuevo-cobro">Nuevo cobro</button>
        <button class="btn primario" id="imprimir">Imprimir recibo</button>
      </div>
    </section>
  </main>
</div>
<script src="js/auth.js"></script><script src="js/api.js"></script>
<script>
Auth.proteger(); pintarMenu('punto-venta.html');
if (!ROLES_CAJA.includes(Auth.usuario().rol)) location.href = 'dashboard.html';

const estado = { socio: null, tipo: null, metodo: 'efectivo', tipos: [] };
const METODOS = { efectivo: 'Efectivo', tarjeta: 'Tarjeta', transferencia: 'Transferencia' };
let temporizador;

function pintarSocio() {
  const s = estado.socio;
  $('#socio-elegido').classList.toggle('oculto', !s);
  $('#buscador').classList.toggle('oculto', !!s);
  if (s) {
    const m = s.membresia || {};
    $('#socio-elegido').innerHTML = `
      <div class="nombre-grande" style="font-size:2rem">${esc(s.nombre)} ${esc(s.apellidos)}</div>
      <p class="muted">${esc(s.codigo_credencial)}</p>
      <p>${insignia(m.estado || 'sin_membresia')} ${m.vigente_hasta ? 'hasta ' + fecha(m.vigente_hasta) : ''}</p>
      <button class="btn chico" id="cambiar">Cambiar socio</button>`;
    $('#cambiar').onclick = () => { estado.socio = null; pintarSocio(); validar(); };
  }
}

function pintarOpciones() {
  $('#tipos').innerHTML = estado.tipos.map(t => `
    <button type="button" class="opcion" data-tipo="${t.id}" aria-pressed="${estado.tipo?.id === t.id}">
      <span>${esc(t.nombre)}<br><span class="muted">${esc(t.descripcion || '')}</span></span>
      <span class="precio">${dinero(t.precio)}</span></button>`).join('');
  $('#metodos').innerHTML = Object.entries(METODOS).map(([k, v]) => `
    <button type="button" class="opcion" data-metodo="${k}" aria-pressed="${estado.metodo === k}" style="justify-content:center">${v}</button>`).join('');
  $('#total').textContent = dinero(estado.tipo ? estado.tipo.precio : 0);
}

function validar() { $('#cobrar').disabled = !(estado.socio && estado.tipo); }

async function elegirSocio(id) {
  estado.socio = await api('socios/' + id);
  $('#resultados').classList.add('oculto'); pintarSocio(); validar();
}

$('#q').addEventListener('input', () => {
  clearTimeout(temporizador);
  temporizador = setTimeout(async () => {
    const q = $('#q').value.trim(); const caja = $('#resultados');
    if (q.length < 2) return caja.classList.add('oculto');
    try {
      const lista = await api('socios?buscar=' + encodeURIComponent(q));
      caja.innerHTML = lista.length ? lista.slice(0, 8).map(s =>
        `<button type="button" data-id="${s.id}">${esc(s.nombre)} ${esc(s.apellidos)} <span class="muted">· ${esc(s.codigo_credencial)}</span></button>`).join('')
        : '<div class="vacio">No encontramos a nadie con esa búsqueda.</div>';
      caja.classList.remove('oculto');
    } catch (e) { avisar(e.message, 'error'); }
  }, 250);
});
$('#resultados').addEventListener('click', (e) => { const b = e.target.closest('[data-id]'); if (b) elegirSocio(b.dataset.id); });

$('#venta').addEventListener('click', (e) => {
  const t = e.target.closest('[data-tipo]'), m = e.target.closest('[data-metodo]');
  if (t) estado.tipo = estado.tipos.find(x => x.id == t.dataset.tipo);
  if (m) estado.metodo = m.dataset.metodo;
  if (t || m) { pintarOpciones(); validar(); }
});

$('#cobrar').onclick = async () => {
  $('#cobrar').disabled = true; $('#error').textContent = '';
  try {
    const r = await api('pagos', { method: 'POST', body: { socio_id: estado.socio.id, tipo_membresia_id: estado.tipo.id, metodo: estado.metodo } });
    $('#r-folio').textContent = r.folio; $('#r-fecha').textContent = fecha(r.fecha) + ' ' + hora(r.fecha);
    $('#r-socio').textContent = r.socio.nombre; $('#r-concepto').textContent = r.concepto;
    $('#r-vigencia').textContent = r.vigencia ? fecha(r.vigencia.desde) + ' al ' + fecha(r.vigencia.hasta) : '—';
    $('#r-metodo').textContent = METODOS[r.metodo]; $('#r-cajero').textContent = r.cajero || '';
    $('#r-total').textContent = dinero(r.monto);
    $('#venta').classList.add('oculto'); $('#recibo').classList.remove('oculto');
    avisar('Cobro registrado.');
  } catch (e) { $('#error').textContent = e.message; validar(); }
};
$('#imprimir').onclick = () => window.print();
$('#nuevo-cobro').onclick = () => {
  estado.socio = null; estado.tipo = null; $('#q').value = '';
  $('#recibo').classList.add('oculto'); $('#venta').classList.remove('oculto');
  pintarSocio(); pintarOpciones(); validar();
};

(async () => {
  try {
    estado.tipos = await api('membresias/tipos'); pintarOpciones();
    const id = new URLSearchParams(location.search).get('socio');
    if (id) await elegirSocio(id);
  } catch (e) { avisar(e.message, 'error'); }
})();
</script>
</body>
</html>
