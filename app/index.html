<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · GymControl</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin-styles.css">
<link rel="icon" type="image/png" href="img/circulo.png">
</head>
<body>
<main class="entrada">
  <section class="lado">
    <div class="marca"><span class="disco"></span>GymControl</div>
    <h1>Cada socio, cada pago, cada entrada.</h1>
    <p>Panel para administradores, recepcionistas e instructores.</p>
  </section>
  <form id="form" novalidate>
    <h2>Iniciar sesión</h2>
    <div><label for="email">Correo</label><input id="email" type="email" autocomplete="username" required autofocus></div>
    <div><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div>
    <div class="error" id="error" role="alert"></div>
    <button class="btn primario" id="enviar">Iniciar sesión</button>
  </form>
</main>
<script src="js/auth.js"></script><script src="js/api.js"></script>
<script>
if (Auth.token() && Auth.usuario()) location.href = 'dashboard.html';
$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#enviar'); btn.disabled = true; $('#error').textContent = '';
  try { await Auth.iniciarSesion($('#email').value.trim(), $('#password').value); }
  catch (err) { $('#error').textContent = err.message; btn.disabled = false; }
});
</script>
</body>
</html>
