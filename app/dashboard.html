<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumen · GymControl</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin-styles.css">
<link rel="icon" type="image/png" href="img/circulo.png">
</head>
<body>
<div class="app">
  <nav class="menu" id="menu" aria-label="Menú principal"></nav>
  <main class="contenido">
    <div class="encabezado"><div><h1>Resumen del día</h1><p class="muted" id="fecha-hoy"></p></div></div>
    <section class="cifras" aria-label="Indicadores">
      <div class="card"><span class="cifra" id="c-socios">–</span>Socios registrados</div>
      <div class="card"><span class="cifra" id="c-entradas">–</span>Entradas permitidas hoy</div>
      <div class="card" id="tarjeta-cobro"><span class="cifra" id="c-cobrado">–</span>Cobrado hoy</div>
      <div class="card"><span class="cifra" id="c-vencer">–</span>Membresías por vencer</div>
    </section>
    <section class="card" id="bloque-vencer">
      <h2>Vencen en los próximos 7 días</h2>
      <p class="muted">Avísales por teléfono o correo antes de que pierdan el acceso.</p>
      <div class="tabla-scroll"><table>
        <thead><tr><th>Socio</th><th>Teléfono</th><th>Correo</th><th>Vence</th></tr></thead>
        <tbody id="vencer"></tbody>
      </table></div>
    </section>
  </main>
</div>
<script src="js/auth.js"></script><script src="js/api.js"></script>
<script>
Auth.proteger(); pintarMenu('dashboard.html');
const caja = ROLES_CAJA.includes(Auth.usuario().rol);
$('#fecha-hoy').textContent = new Date().toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
if (!caja) { $('#tarjeta-cobro').classList.add('oculto'); $('#bloque-vencer').classList.add('oculto'); }

(async () => {
  try { await api('membresias/actualizar-estados', { method: 'POST' }); } catch {}
  const [socios, asist, corte, vencer] = await Promise.allSettled([
    api('socios'),
    caja ? api('asistencias') : Promise.reject(),
    caja ? api('pagos/corte') : Promise.reject(),
    caja ? api('membresias/por-vencer') : Promise.reject(),
  ]);
  if (socios.status === 'fulfilled') $('#c-socios').textContent = socios.value.length;
  if (asist.status === 'fulfilled') $('#c-entradas').textContent = asist.value.filter(a => a.resultado === 'permitido').length;
  if (corte.status === 'fulfilled') $('#c-cobrado').textContent = dinero(corte.value.total);
  if (vencer.status === 'fulfilled') {
    $('#c-vencer').textContent = vencer.value.length;
    $('#vencer').innerHTML = vencer.value.length
      ? vencer.value.map(s => `<tr><td>${esc(s.nombre)} ${esc(s.apellidos)}</td><td>${esc(s.telefono || '—')}</td><td>${esc(s.email)}</td><td>${fecha(s.fecha_fin)}</td></tr>`).join('')
      : '<tr><td colspan="4" class="vacio">Nadie vence esta semana.</td></tr>';
  } else { $('#c-vencer').textContent = '–'; }
})();
</script>
</body>
</html>
