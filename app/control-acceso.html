<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de acceso · GymControl</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin-styles.css">
<link rel="icon" type="image/png" href="img/circulo.png">
</head>
<body>
<div class="app">
  <nav class="menu" id="menu" aria-label="Menú principal"></nav>
  <main class="contenido">
    <div class="encabezado"><h1>Control de acceso</h1><p class="muted">Deja esta pantalla abierta en recepción.</p></div>
    <label for="codigo" class="muted">Escanea la credencial o escribe el código y presiona Enter</label>
    <input id="codigo" class="lector" autocomplete="off" autofocus placeholder="GYM000000">
    <section class="puerta" id="puerta" aria-live="assertive">
      <div><div class="nombre-grande">Listo para escanear</div><p class="muted">El resultado aparece aquí.</p></div>
    </section>
    <section class="card" style="margin-top:24px">
      <h2>Registros de hoy</h2>
      <div class="tabla-scroll"><table>
        <thead><tr><th>Hora</th><th>Socio</th><th>Resultado</th><th>Motivo</th></tr></thead>
        <tbody id="lista"></tbody>
      </table></div>
    </section>
  </main>
</div>
<script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/acceso.js"></script>
</body>
</html>
