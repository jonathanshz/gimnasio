<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi gimnasio · Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal-styles.css">
<link rel="icon" type="image/png" href="img/circulo.png">
</head>
<body>
<main class="acceso">
  <div class="marca" style="color:var(--azul-hondo);font-size:2rem"><span class="disco"></span>GymControl</div>
  <div><h1>Consulta tu membresía</h1><p class="muted">Revisa tu vigencia, tu credencial y tus pagos desde el celular.</p></div>
  <form id="form" novalidate>
    <div><label for="email">Correo</label><input id="email" type="email" autocomplete="username" required></div>
    <div><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div>
    <div class="error" id="error" role="alert"></div>
    <button class="btn" id="enviar">Iniciar sesión</button>
  </form>
  <p class="muted">¿No tienes contraseña? Pídela en recepción cuando te registres.</p>
</main>
<script src="js/portal-api.js"></script>
<script>
if (Sesion.token()) location.href = 'mi-membresia.html';
$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#enviar'); btn.disabled = true; $('#error').textContent = '';
  try {
    const d = await api('auth/portal-login', { method: 'POST', body: { email: $('#email').value.trim(), password: $('#password').value } });
    Sesion.guardar(d.token); location.href = 'mi-membresia.html';
  } catch (err) { $('#error').textContent = err.message; btn.disabled = false; }
});
</script>
</body>
</html>
